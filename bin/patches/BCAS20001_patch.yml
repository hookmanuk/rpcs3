  "Frame rate follows VR":
    Games:
      "RIDGE RACER 7":
        BCAS20001: [ 01.00 ]
    Author: "VR fork"
    Notes: "Ridge Racer 7 runs one game step per vblank and counts time in frames, so at 90 Hz everything ran 1.5x. The VR profile writes the frame rate here (0x4d8ff4) and the milliseconds per frame (0x4d8ff0); the race timers, lap/race/time-limit clocks, per-car and HUD frame counters and the 2D animation clock then advance by the real time of each frame (from the vblank count at 0x1028d6e4), so races run at real speed with correct times at any VR frame rate. At 60 Hz nothing changes. Physics follows the frame time floats the profile writes."
    Patch Version: 1.0
    Enabled By Default: true
