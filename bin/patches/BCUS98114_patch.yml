PPU-d73f342bf28ee016ef3d0ccb309b1acb03d8ecce:
  "Frame rate follows VR":
    Games:
      "Gran Turismo 5":
        BCUS98114: [ 02.11 ]
    Author: "VR fork"
    Notes: "Gran Turismo 5 takes one fixed physics step per frame with the step length read from a constant (1/59.94 s, 0x14017f8). With Unlock FPS at 90 Hz the whole game ran 1.5x. The step length is now read from a writable word (0x1948440) that the VR profile sets to 1/fps, so physics, cars and timers run in real time at any frame rate. At 60 Hz nothing changes."
    Patch Version: 1.0
    Enabled By Default: true
    Patch:
      - [ be32, 0x01948440, 0x3c88ab7c ]  # seconds per frame (native 1/59.94), written by the VR profile
      - [ be32, 0x00182a30, 0x3d200195 ]  # lis r9,0x195        (was lis r9,0x140)
      - [ be32, 0x00182a34, 0xc0298440 ]  # lfs f1,-0x7bc0(r9) = [0x1948440] (was lfs f1,0x17f8(r9))

PPU-a5e547ce3ce25092ac6cae85631f50ba5d9ea914:
  "Pre-race at full frame rate":
    Games:
      "Gran Turismo 5":
        BCUS98114: [ 01.00 ]
    Author: "VR fork"
    Notes: "The pre-race grid and other 2D-backed 3D scenes flip every second vblank (30 FPS at 60 Hz, 45 at 90). The game picks that interval at 0x17e300 (stored at 0x18ee6ac); this makes it always one vblank, as in races."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x0017e300, 0x38000001 ]  # li r0,1 (was li r0,2): flip interval 1

  "VR: Wider view (head-driven culling)":
    Games:
      "Gran Turismo 5":
        BCUS98114: [ 01.00 ]
    Author: "VR fork"
    Notes: "Gran Turismo 5 draws only what its own camera sees (about 75 degrees across), so in the headset, cars beside you and near the sides of a turned view lost their outside pieces. This widens the game's camera horizontally by a scale (word 0x1a48200) that the VR profile sets each frame from the head pose (culling_scale_f32, tangent_x): just wide enough to cover both eyes left to right, 1.0 on the fixed screen. The height is the game's own. The headset view keeps its framing (VR re-projects it); the rear-view mirror and the camera's sub-pixel jitter are compensated. Untick to go back to the game's own view."
    Patch Version: 1.3
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x01a48200, 0x3f800000 ]  # scale (1.0), written by the VR profile; past the data segment's end (0x1a481a8), same page
      - [ be32, 0x01782480, 0xec2000b2 ]  # cave 1: fmuls f1,f0,f2         the decorator's x scale, as before
      - [ be32, 0x01782484, 0x3d8001a5 ]  #         lis r12,0x1a5
      - [ be32, 0x01782488, 0xc14c8200 ]  #         lfs f10,-0x7e00(r12)  scale
      - [ be32, 0x0178248c, 0xec215024 ]  #         fdivs f1,f1,f10       projection x / scale: wider left and right only
      - [ be32, 0x01782490, 0x4e800020 ]  #         blr
      - [ be32, 0x017824a0, 0x3d8001a5 ]  # cave 2: lis r12,0x1a5         (rear-view mirror)
      - [ be32, 0x017824a4, 0xc14c8200 ]  #         lfs f10,-0x7e00(r12)
      - [ be32, 0x017824a8, 0xec2102b2 ]  #         fmuls f1,f1,f10       the mirror's glScalef x times the scale
      - [ be32, 0x017824ac, 0x4b5b8804 ]  #         b 0xd3acb0            glScalef
      - [ be32, 0x017824c0, 0xec00002a ]  # cave 3: fadds f0,f0,f0         the camera's sub-pixel x jitter (x2), as before
      - [ be32, 0x017824c4, 0x3d8001a5 ]  #         lis r12,0x1a5
      - [ be32, 0x017824c8, 0xc14c8200 ]  #         lfs f10,-0x7e00(r12)
      - [ be32, 0x017824cc, 0xec005024 ]  #         fdivs f0,f0,f10       / scale: VR stretches the widened view back by the scale, which magnified the jitter
      - [ be32, 0x017824d0, 0x4e800020 ]  #         blr
      - [ be32, 0x0091e1f0, 0x48000044 ]  # projection decorator 0x91e178: always scale (was bne cr7,0x91e234: only with a non-default zoom)
      - [ be32, 0x0091e29c, 0x48e641e5 ]  # bl cave 1 (was fmuls f1,f0,f2)
      - [ be32, 0x00305170, 0x4947d331 ]  # mirror: bl cave 2 (was bl 0xd3acb0)
      - [ be32, 0x0091c254, 0x48e6626d ]  # projection wrapper 0x91c19c, x jitter: bl cave 3 (was fadds f0,f0,f0)
      - [ be32, 0x017824e0, 0xc1a100c0 ]  # cave 4: lfs f13,0xc0(r1)       the mirror reads the projection back (P00) to size its viewport
      - [ be32, 0x017824e4, 0x3d8001a5 ]  #         lis r12,0x1a5
      - [ be32, 0x017824e8, 0xc14c8200 ]  #         lfs f10,-0x7e00(r12)
      - [ be32, 0x017824ec, 0xedad02b2 ]  #         fmuls f13,f13,f10     P00 x scale: the game's own P00, so the mirror keeps its width
      - [ be32, 0x017824f0, 0x4e800020 ]  #         blr
      - [ be32, 0x00305088, 0x4947d459 ]  # mirror: bl cave 4 (was lfs f13,0xc0(r1))

  "VR: No camera jitter":
    Games:
      "Gran Turismo 5":
        BCUS98114: [ 01.00 ]
    Author: "VR fork"
    Notes: "Gran Turismo 5 shifts its camera by a fraction of a pixel each frame for its anti-aliasing. In the headset that shows as a fine shimmer. This keeps the camera still (the jitter offsets read 0). Edges may look slightly more aliased; no frame-rate change. Off by default."
    Patch Version: 1.0
    Enabled By Default: false
    Apply To Savestates: true
    Patch:
      - [ be32, 0x0091c22c, 0xc0028ec4 ]  # lfs f0,-0x713c(r2) = 0.0 (was lfs f0,0x14(r31): x jitter, per projection scale)
      - [ be32, 0x0091c238, 0xc1828ec4 ]  # lfs f12,-0x713c(r2) = 0.0 (was lfs f12,0xc(r31): x jitter)
      - [ be32, 0x0091c264, 0xc0028ec4 ]  # lfs f0,-0x713c(r2) = 0.0 (was lfs f0,0x18(r31): y jitter, per projection scale)
      - [ be32, 0x0091c26c, 0xc1628ec4 ]  # lfs f11,-0x713c(r2) = 0.0 (was lfs f11,0x10(r31): y jitter)

  "VR: Sharp shadows further out":
    Games:
      "Gran Turismo 5":
        BCUS98114: [ 01.00 ]
    Author: "VR fork"
    Notes: "Gran Turismo 5 draws shadows in three steps of detail by distance (cascades). The sharpest one ends about 9 units from the camera, so in the headset shadows visibly turn softer a short way ahead. This moves that step 2.5x further out (about 22 units); the next steps stay where they are. The closest shadows get a little softer in exchange (the same shadow map covers more ground). Untick to go back to the game's split."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x01782600, 0xec3f0072 ]  # cave: fmuls f1,f31,f1     split i = the view's shadow scale x the split's factor (as before)
      - [ be32, 0x01782604, 0x2f9f0000 ]  #       cmpwi cr7,r31,0      split 0 (the sharpest cascade's end)?
      - [ be32, 0x01782608, 0x4c9e0020 ]  #       bnelr cr7
      - [ be32, 0x0178260c, 0x3d800178 ]  #       lis r12,0x178
      - [ be32, 0x01782610, 0xc00c2620 ]  #       lfs f0,0x2620(r12)   the factor below
      - [ be32, 0x01782614, 0xec210032 ]  #       fmuls f1,f1,f0
      - [ be32, 0x01782618, 0x4e800020 ]  #       blr
      - [ be32, 0x01782620, 0x40200000 ]  # 2.5: how much further the sharpest cascade reaches
      - [ be32, 0x004c1df4, 0x492c080d ]  # bl cave (was fmuls f1,f31,f1 in the split loop 0x4c1dec, setter 0x91b6c4 -> 0x965094)

  "Race ticks follow the frame time":
    Games:
      "Gran Turismo 5":
        BCUS98114: [ 01.00 ]
    Author: "VR fork"
    Notes: "The race adds one 1/60 s tick per step (the race clock, lap and sector times). Above 60 steps a second the clock ran fast (1.5x at 90 FPS). The ticks now follow the step length (the frame-time word the VR profile writes): 60 a second at any frame rate. The physics step is the profile's (game_frame_time_f32)."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x01782500, 0x3d600184 ]  # lis r11, 0x184
      - [ be32, 0x01782504, 0xc00b680c ]  # lfs f0, 0x680c(r11)
      - [ be32, 0x01782508, 0x3d800178 ]  # lis r12, 0x178
      - [ be32, 0x0178250c, 0xc1ac25f0 ]  # lfs f13, 0x25f0(r12)
      - [ be32, 0x01782510, 0xec000372 ]  # fmuls f0, f0, f13
      - [ be32, 0x01782514, 0xfc00001c ]  # fctiw f0, f0
      - [ be32, 0x01782518, 0x3d8001a5 ]  # lis r12, 0x1a5
      - [ be32, 0x0178251c, 0x398c8220 ]  # addi r12, r12, -0x7de0
      - [ be32, 0x01782520, 0x7c0067ae ]  # stfiwx f0, 0, r12
      - [ be32, 0x01782524, 0x800c0000 ]  # lwz r0, 0(r12)
      - [ be32, 0x01782528, 0x816c0004 ]  # lwz r11, 4(r12)
      - [ be32, 0x0178252c, 0x7d6b0214 ]  # add r11, r11, r0
      - [ be32, 0x01782530, 0x5560043e ]  # clrlwi r0, r11, 0x10
      - [ be32, 0x01782534, 0x900c0004 ]  # stw r0, 4(r12)
      - [ be32, 0x01782538, 0x556b843e ]  # srwi r11, r11, 0x10
      - [ be32, 0x0178253c, 0x801a01e0 ]  # lwz r0, 0x1e0(r26)
      - [ be32, 0x01782540, 0x7c005a14 ]  # add r0, r0, r11
      - [ be32, 0x01782544, 0x901a01e0 ]  # stw r0, 0x1e0(r26)
      - [ be32, 0x01782548, 0x4ac8bf40 ]  # b 0x40e488
      - [ be32, 0x017825f0, 0x4a700000 ]  # 60 x 65536: ticks a second, 16-bit fraction
      - [ be32, 0x0040e420, 0x493740e0 ]  # b cave (was lwz r0,0x1e0(r26): the race tick count += ticks)
