  "Wider view (VR culling)":
    Games:
      "Dante's Inferno":
        BLUS30405: [ 01.00 ]
    Author: "VR fork"
    Notes: "Widens the gameplay camera's field of view (61.9 degrees across) by the chosen scale, up to 170 degrees, where the camera update passes it to the camera's perspective setter (0x452f1c). The game culls against this frustum, so objects at the edges of the headset view are no longer missing. Two more changes keep full detail at any scale: (1) the EDGE geometry jobs (SPU) cull triangles that cover no pixel of the game's viewport; with a wider projection the characters shrink on that viewport and lost most of their triangles (holes in the headset). The culling viewport and scissor are scaled up 20x, so that test runs at the normal view's pixel size or finer, and the frustum test is unchanged. (2) The size metric that culls small objects and effects (fire, torches) uses the unwidened field of view. The VR renderer remaps from the game's projection, so the headset image keeps its scale; flat play shows a wide-angle view (choose 1.0 to play flat). The code runs in the body of the camera-shake modifier at 0x663d8, which this patch (like 'Disable camera shake (VR)') makes return at once, so the hit camera shake is off too. Applies when the game boots, not when a savestate is loaded."
    Configurable Values:
      "Scale":
        Type: double_enum
        Value: 2.75
        Allowed Values:
          "1.0 (off: 62 degrees)": 1.0
          "1.5 (93 degrees)": 1.5
          "2.0 (124 degrees)": 2.0
          "2.25 (139 degrees)": 2.25
          "2.5 (155 degrees)": 2.5
          "2.75 (170 degrees, maximum, recommended)": 2.75
    Patch Version: 3.0
    Enabled By Default: true
    Patch:
      - [ be32, 0x000663d8, 0x4e800020 ] # camera-shake modifier: blr at entry (its body below is free)
      # field of view at the camera perspective setter call: min(fov x Scale, 170 degrees)
      - [ be32, 0x000663e0, 0x3d200006 ] # lis r9, 0x6
      - [ be32, 0x000663e4, 0xc0296400 ] # lfs f1, 0x6400(r9)   scale
      - [ be32, 0x000663e8, 0xec2107f2 ] # fmuls f1, f1, f31     field of view x scale
      - [ be32, 0x000663ec, 0xc0096404 ] # lfs f0, 0x6404(r9)   maximum
      - [ be32, 0x000663f0, 0xeda10028 ] # fsubs f13, f1, f0
      - [ be32, 0x000663f4, 0xfc2d082e ] # fsel f1, f13, f0, f1  min(field of view x scale, maximum)
      - [ be32, 0x000663f8, 0x4e800020 ] # blr
      - [ bef32, 0x00066400, "Scale" ]
      - [ bef32, 0x00066404, 2.96706 ]   # 170 degrees (radians)
      - [ bef32, 0x00066408, 20.0 ]      # EDGE culling screen scale (>= the projection shrink at 2.75: 19.05)
      - [ be32, 0x0006640c, 0x00000014 ] # the same, an integer for the scissor
      # EDGE viewport setter (0x5ef390): the culling viewport scales and offsets x 20 (template 0x1342e00 +0x50, +0x60)
