  "Smooth cutscenes (interpolated cutscene tracks)":
    Games:
      "Demon's Souls":
        BLUS30443: [ 01.00 ]
    Author: "VR fork"
    Notes: "In-engine cutscenes move the camera and cutscene-driven objects along keyframe tracks sampled at 30 per second without interpolation (the sampler at 0x5f71d0 takes the nearest key), so at 60 or 90 FPS the camera holds still for every second or third frame. This samples the keys either side of the cutscene time and blends the two transforms. Needs a fresh boot: savestates keep their old code."
    Patch Version: 1.0
    Enabled By Default: true
    Patch:
