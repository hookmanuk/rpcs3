  "Wider view culling (VR)":
    Games:
      "Asura's Wrath":
        BLUS30721: [ 01.00 ]
    Author: "VR fork"
    Notes: "Objects outside the game camera's view are culled, and the cutscene cameras are narrow (22 to 40 degrees), so in the headset whole buildings were missing, or popped in as the head turned. This widens only the main view's culling frustum to the chosen angle (180: everything ahead of the camera): the scene view's call to GetViewFrustumBounds (0x662aec) goes through a code cave that passes it the view-projection with x and y opened up. Rendering and level of detail keep the game's camera, so flat play looks the same; more objects are drawn. The cave reuses the radial blur function, so radial blur is off (as with 'Disable Motion Blur'). Also applies to savestates."
    Configurable Values:
      "Culling":
        Type: double_enum
        Value: 0.0
        Allowed Values:
          "180 degrees: everything ahead of the camera (recommended)": 0.0
          "160 degrees": 0.176327
          "140 degrees": 0.36397
          "120 degrees": 0.57735
          "The game's own view": 1000.0
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x0067a908, 0x60000000 ] # nop  (radial blur call: nop (as "Disable Motion Blur"); its function becomes the cave)
      - [ be32, 0x00679ff8, 0xf821ff51 ] # stdu r1, -0xb0(r1)
      - [ be32, 0x00679ffc, 0x7c0802a6 ] # mflr r0
