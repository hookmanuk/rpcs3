  "Unlock FPS (VR)":
    Games:
      "Asura's Wrath":
        BLUS30721: [ 01.00 ]
    Author: "Whatcookie (community patch, bundled by VR fork)"
    Notes: "The community patch 'Unlock FPS' (patch.yml), on by default here so the game runs at the headset rate without downloading the community patches. The game then runs at real-time speed; some button-mashing QTEs are harder at higher frame rates. Turning on the community 'Unlock FPS' too is harmless (same changes). Also applies to savestates."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x008bbd04, 0x60000000 ] # nop
      - [ be32, 0x008bbd64, 0x60000000 ] # nop
      - [ be32, 0x008bbd68, 0x60000000 ] # nop
  "Disable Motion Blur (VR)":
    Games:
      "Asura's Wrath":
        BLUS30721: [ 01.00 ]
    Author: "boma (community patch, bundled by VR fork)"
    Notes: "The community patch 'Disable Motion Blur' (patch.yml), on by default here: the radial and camera blur are full-screen effects that look wrong in the headset. Turning on the community patch too is harmless (same changes). Also applies to savestates."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x0067a908, 0x60000000 ] # nop - disables radial blur (also done by 'Wider view culling (VR)')
      - [ be32, 0x0067a940, 0x38600000 ] # li r3, 0 - disables camera-based blur
