    Author: "Aphelion, illusion (community patch, bundled by VR fork)"
    Notes: "The community patch '60 FPS' (patch.yml), on by default here so the game runs above 30 FPS without downloading the community patches; 'Frame rate follows VR' keeps it at real speed at the headset rate. Turning on the community '60 FPS' too is harmless (same changes)."
    Patch Version: 1.1
    Enabled By Default: true
    Patch:
      - [ be32, 0x00710694, 0x38600002 ]
      - [ be32, 0x0023f114, 0x3a900001 ]
