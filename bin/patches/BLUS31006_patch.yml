Version: 1.2

PPU-a7f26bbbcb13fd5f554d0612f490861feec78e8f:
  "Frame rate follows VR (use with 60 FPS)":
    Games:
      "Tales of Xillia":
        BLUS31006: [ All ]
    Author: "VR fork"
    Notes: "Needs a 60 FPS patch: '60 FPS (VR)' below (on by default) or the community '60 FPS'. The game advances one 60 Hz tick per frame, so above 60 FPS it runs fast. The frame-timing object (0xe34118) holds the tick count (+0xa8) and step (+0xa4), read through the getters 0x23e074/0x23e0d4 by all game systems. This scales the tick count by 60/fps, using 1/fps from the word at 0xf11ac8, which the VR profile sets every frame (game_frame_time_f32). The patch seeds it with 1/60, so without the profile the game is unchanged."
    Patch Version: 1.0
    Enabled By Default: true
    Patch:
      - [ be32, 0x00f11ac8, 0x3c888889 ] # 1/60: the frame time word (bss), until the VR profile sets 1/fps
      - [ calloc, 0x0023f12c, 11 ]
      - [ be32, 0x0, 0x3d8000f1 ] # lis r12, 0xf1
      - [ be32, 0x0, 0x816c1ac8 ] # lwz r11, 0x1ac8(r12)   W = 1/fps (VR profile game_frame_time_f32)
      - [ be32, 0x0, 0x2c0b0000 ] # cmpwi r11, 0
      - [ be32, 0x0, 0x4182001c ] # beq 0x10000028   W = 0: unchanged
      - [ be32, 0x0, 0xc18c1ac8 ] # lfs f12, 0x1ac8(r12)
      - [ be32, 0x0, 0x3d604270 ] # lis r11, 0x4270   60.0
      - [ be32, 0x0, 0x916c1acc ] # stw r11, 0x1acc(r12)
      - [ be32, 0x0, 0xc16c1acc ] # lfs f11, 0x1acc(r12)
      - [ be32, 0x0, 0xed8c02f2 ] # fmuls f12, f12, f11   f12 = 60/fps
      - [ be32, 0x0, 0xec000332 ] # fmuls f0, f0, f12   ticks x 60/fps (stored at +0xa8)
      - [ be32, 0x0, 0xeda00072 ] # fmuls f13, f0, f1   step = ticks x k (the replaced instruction, stored at +0xa4)
  "60 FPS (VR)":
    Games:
      "Tales of Xillia":
