  "Full Pixel Mode always on":
    Games:
      "ICO":
        BCUS98259: [ 01.00 ]
    Author: "VR fork"
    Notes: "Forces the Full Pixel Mode option on, whatever the save or the options menu says. With it off the final image is zoomed about 16% against the game's projection (overscan), which makes the world swim in VR."
    Patch Version: 1.0
    Patch:
      - [ be32, 0x0018eca4, 0x39200001 ] # li r9,1 (was lwz r9,0x10(r31)): the per-frame mode check (object 0xc34270) always sees Full Pixel Mode requested
      - [ be32, 0x0018ec58, 0x38600001 ] # li r3,1 (was lwz r3,0x10(r9)): the mode getter returns on
      - [ be32, 0x00020d38, 0x38000001 ] # li r0,1 (was lwz r0,0x38(r9)): the options menu shows ON (flag at 0x4d1dd8+0x38)
  "Wider view (VR culling)":
    Games:
      "ICO":
        BCUS98259: [ 01.00 ]
    Author: "VR fork"
    Notes: "Widens the game camera's field of view so objects outside the TV frame are still drawn (the game culls to its own frustum). For VR: the headset view is remapped from the game's projection, so the image keeps its scale. Scales tan(FOV/2) both ways; larger values draw more but cost frame rate and may lower LOD."
    Patch Version: 1.0
    Configurable Values:
      "Scale":
        Type: double_enum
        Value: 1920.0
        Allowed Values:
          "1.0 (off)": 640.0
          "1.25": 800.0
          "1.5": 960.0
          "2.0": 1280.0
          "2.5": 1600.0
          "3.0": 1920.0
          "5.0": 3200.0
          "8.0": 5120.0
          "12.0": 7680.0
          "20.0": 12800.0
          "40.0": 25600.0
    Patch:
      - [ bef32, 0x004ca6d0, "Scale" ] # 640.0 divisor of the PS2 screen distance scrz (camera setup 0xd364c, stored at 0xd37a8/0xd37e8); scrz drives the view-screen, view-clip (culling) and RSX projection matrices (0xd3174)
