Version: 1.2

PPU-8363904e0b8fc276380a8f0e158dd81d7a9cefc5:
  "Wider view (VR culling)":
    Games:
      "Uncharted: Drake's Fortune":
        BCUS98103: [ 01.10 ]
    Author: "VR fork"
    Notes: "The game culls against its own 75 x 47 degree view, so in the headset the deck, hull and ocean end at its frustum when you look down or around. This multiplies the tangent of the camera's half field of view by a scale word (0x7cdd80, 1.0 here) where the camera's projection scale is built (0x4b4d3c), so the frustum the game culls and draws against widens. The VR profile sets the word each frame to the smallest scale that holds both eyes' views at the current head pose (culling_scale_f32); without the profile it stays 1.0 and the game is unchanged."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x007cdd80, 0x3f800000 ] # scale word, 1.0 (unused zeros at the end of the code segment)
      # 0x4b4d28: f1 = tanf(fov x k); f1 += [r27+0x30]; cot = f31 / f1, stored at camera +0x1d4 (the projection's x scale)
      - [ calloc, 0x004b4d3c, 4 ] # was lfs f0, 0x30(r27)
      - [ be32, 0x0, 0x3d60007d ] # lis r11, 0x7d
      - [ be32, 0x0, 0xc00bdd80 ] # lfs f0, -0x2280(r11)   scale word 0x7cdd80
      - [ be32, 0x0, 0xec210032 ] # fmuls f1, f1, f0       tan(fov/2) x scale
      - [ be32, 0x0, 0xc01b0030 ] # lfs f0, 0x30(r27)      the original instruction
