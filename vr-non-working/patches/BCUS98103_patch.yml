Version: 1.2

PPU-8363904e0b8fc276380a8f0e158dd81d7a9cefc5:
  "Wider view (VR culling)":
    Games:
      "Uncharted: Drake's Fortune":
        BCUS98103: [ 01.10 ]
    Author: "VR fork"
    Notes: "The game culls against its own 75 x 47 degree view, so in the headset the deck, hull and ocean end at its frustum when you look down or around. This multiplies the tangent of the camera's half field of view by a scale word (0x7cdd80, 1.0 here) where the camera's projection scale is built (0x4b4d3c), so the frustum the game culls against widens. The VR profile sets the word each frame to the smallest scale that holds both eyes' views at the current head pose (culling_scale_f32); without the profile it stays 1.0 and the game is unchanged. Version 2.0: the geometry jobs drop triangles that cover no pixel centre of the 1280x720 grid, and the wider projection shrinks every triangle, so models lost detail (version 1.0: about a quarter of the scene's vertices). Their viewport (built at 0x452420: scissor, viewport scales and offsets) is enlarged 16x about its origin, so the frustum and scissor tests are unchanged and the no-pixel test runs on a 16x finer grid: models keep more detail than the game shipped with at any Resolution Scale."
    Patch Version: 2.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x007cdd80, 0x3f800000 ] # scale word, 1.0 (unused zeros at the end of the code segment)
      # 0x4b4d28: f1 = tanf(fov x k); f1 += [r27+0x30]; cot = f31 / f1, stored at camera +0x1d4 (the projection's x scale)
      - [ calloc, 0x004b4d3c, 4 ] # was lfs f0, 0x30(r27)
      - [ be32, 0x0, 0x3d60007d ] # lis r11, 0x7d
      - [ be32, 0x0, 0xc00bdd80 ] # lfs f0, -0x2280(r11)   scale word 0x7cdd80
      - [ be32, 0x0, 0xec210032 ] # fmuls f1, f1, f0       tan(fov/2) x scale
      - [ be32, 0x0, 0xc01b0030 ] # lfs f0, 0x30(r27)      the original instruction
      # 0x452420 builds the geometry jobs' viewport block (r9): u16 scissor 0, width, 0, height at +8..+0xe, the
      # view-projection at +0x10, viewport scales and offsets at +0x50..+0x5c.
      - [ calloc, 0x00452554, 24 ] # was lwzu r0, 0x140(r11): the geometry viewport block (r9) enlarged 16x before its view-projection is copied
      - [ be32, 0x0, 0x38600010 ] # li r3, 16
      - [ be32, 0x0, 0xf8610070 ] # std r3, 0x70(r1)
      - [ be32, 0x0, 0xc8010070 ] # lfd f0, 0x70(r1)
      - [ be32, 0x0, 0xfc00069c ] # fcfid f0, f0
      - [ be32, 0x0, 0xfc000018 ] # frsp f0, f0           K = 16.0
      - [ be32, 0x0, 0xc1690050 ] # lfs f11, 0x50(r9)
      - [ be32, 0x0, 0xed6b0032 ] # fmuls f11, f11, f0
      - [ be32, 0x0, 0xd1690050 ] # stfs f11, 0x50(r9)
      - [ be32, 0x0, 0xc1690054 ] # lfs f11, 0x54(r9)
      - [ be32, 0x0, 0xed6b0032 ] # fmuls f11, f11, f0
      - [ be32, 0x0, 0xd1690054 ] # stfs f11, 0x54(r9)
      - [ be32, 0x0, 0xc1690058 ] # lfs f11, 0x58(r9)
      - [ be32, 0x0, 0xed6b0032 ] # fmuls f11, f11, f0
      - [ be32, 0x0, 0xd1690058 ] # stfs f11, 0x58(r9)
      - [ be32, 0x0, 0xc169005c ] # lfs f11, 0x5c(r9)
      - [ be32, 0x0, 0xed6b0032 ] # fmuls f11, f11, f0
      - [ be32, 0x0, 0xd169005c ] # stfs f11, 0x5c(r9)
      - [ be32, 0x0, 0xa069000a ] # lhz r3, 0xa(r9)   scissor width
      - [ be32, 0x0, 0x54632036 ] # slwi r3, r3, 4
      - [ be32, 0x0, 0xb069000a ] # sth r3, 0xa(r9)
      - [ be32, 0x0, 0xa069000e ] # lhz r3, 0xe(r9)   scissor height
      - [ be32, 0x0, 0x54632036 ] # slwi r3, r3, 4
      - [ be32, 0x0, 0xb069000e ] # sth r3, 0xe(r9)
      - [ be32, 0x0, 0x840b0140 ] # lwzu r0, 0x140(r11)
