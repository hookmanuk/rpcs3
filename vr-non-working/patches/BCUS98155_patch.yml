  "Wider view (VR culling)":
    Games:
      "MotorStorm: Pacific Rift":
        BCUS98155: [ 01.00 ]
    Author: "VR fork"
    Notes: "MotorStorm draws only what its own camera sees (about 87 degrees across), so in the headset, terrain and sky beside a turned view were missing (black, or smeared older frames). This widens the camera horizontally by a scale (word 0x145fe00) that the VR profile sets each frame from the head pose (culling_scale_f32, tangent_x): just wide enough to cover both eyes, 1.0 on the fixed screen. The height is the game's own; the headset view keeps its framing (VR re-projects it)."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x0145fe00, 0x3f800000 ]  # scale (1.0), written by the VR profile; past the data segment's end (0x14506a8), same page as the frame-time word
      - [ be32, 0x01028ad0, 0xec410132 ]  # cave: fmuls f2,f1,f4         the projection's aspect, as before
      - [ be32, 0x01028ad4, 0x3d800146 ]  #       lis r12,0x146
      - [ be32, 0x01028ad8, 0xc14cfe00 ]  #       lfs f10,-0x200(r12)   scale
      - [ be32, 0x01028adc, 0xec4202b2 ]  #       fmuls f2,f2,f10       aspect x scale: wider left and right only (vertical FOV unchanged)
      - [ be32, 0x01028ae0, 0x4e800020 ]  #       blr
      - [ be32, 0x0033b108, 0x48ced9c9 ]  # camera update: bl cave (was fmuls f2,f1,f4, before the perspective call at 0x33b114)

  "Disable camera shake (VR)":
    Games:
      "MotorStorm: Pacific Rift":
        BCUS98155: [ 01.00 ]
    Author: "VR fork"
    Notes: "Boosting (X) shakes the view quickly left and right: the chase view hangs under a 'Vehicle shake platform' node whose shake range the game raises while boosting. In the headset that is a fast jolt every frame. The range is now kept at zero, so the view stays steady."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      # 0x373680 (vehicle camera update) stores the shake range (x, y) of the "Vehicle shake platform" node (+0x80); the node's
      # update (0x42e65c) scales its random step by the range and clamps its offset to +-range, so a zero range keeps it at 0.
      # r9 is 0 here (li r9,0 at 0x37383c; the game stores it as the range z at 0x373870).
      - [ be32, 0x0037384c, 0x91370004 ]  # stw r9,4(r23)  range y = 0 (was stfs f30,4(r23): 0.003 at rest, ~1.0 boosting)
      - [ be32, 0x00373850, 0x91370000 ]  # stw r9,0(r23)  range x = 0 (was stfs f3,0(r23))
