Version: 1.2

PPU-8254e202229bc5be77d12bf298d6f40b169c4cde:
  "Unlocked frame rate (follows Vblank Rate)":
    Games:
      "Prince of Persia":
        BLUS30214: [ 01.00 ]
    Author: "VR fork"
    Notes: "Presents a frame on every vblank instead of every second one. The game's vblank handler (0x1bc810) counts GCM label 0x43 down once per vblank; each frame sets it to 2 and the GPU waits for 0 before the next frame. The handler now clears it on every vblank, so the frame rate follows the Vblank Rate (the VR rate in VR). Game time is real time: its clocks advance 1.0 per second at 30 and at 60 FPS."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x001bc86c, 0x3ba00000 ] # li r29, 0 (was subf r29, r0, r29: label 0x43 minus 1 while above 0)

  "VR: Shadows cover the headset view":
    Games:
      "Prince of Persia":
        BLUS30214: [ 01.00 ]
    Author: "VR fork"
    Notes: "Prince of Persia fits its shadow maps to its own camera's view (71 x 44 degrees). The headset shows much more, above all below and to the sides, and there the ground had no shadows, with a straight edge that moved as the camera moved (shadows came and went behind the player). The shadow fit's frustum corners (0x1fb4e8: tan(FOV / 2) x far, x aspect) now use tan(FOV / 2) x a scale (word 0x15855d0) that the VR profile sets each frame from the head pose (culling_scale_f32, tangent): just wide enough for the headset view, 1.0 on the fixed screen. The camera itself is the game's own. Untick to go back to the game's own shadow fit."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x015855d0, 0x3f800000 ]  # scale (1.0), written by the VR profile; past the data segment's end (0x15855c8), same page
      - [ calloc, 0x001fb524, 3 ]          # after bl tanf (0x4b3b8) in the shadow fit's frustum corners (was nop)
      - [ be32, 0x0, 0x3d800158 ]          # lis r12,0x158
      - [ be32, 0x0, 0xc1ac55d0 ]          # lfs f13,0x55d0(r12)    scale (f13 is reloaded at 0x1fb530)
      - [ be32, 0x0, 0xec210372 ]          # fmuls f1,f1,f13        tan(FOV / 2) x scale

  "VR: Wider view (head-driven culling)":
    Games:
      "Prince of Persia":
        BLUS30214: [ 01.00 ]
    Author: "VR fork"
    Notes: "Prince of Persia draws only what its own camera sees (71 x 44 degrees), so with the headset looking a little up or to the side, trees and cliff tops above or beside the game's view came and went as the camera moved. The projection builder (0x27b3d0) writes the culling frustum's tangents (horizontal +8, vertical +0xc); the vertical one is now multiplied by the head-driven scale the VR profile sets each frame (word 0x15855d0, shared with 'Shadows cover the headset view'): just wide enough for the headset view, 1.0 on the fixed screen. The horizontal tangent stays the game's own: the camera controller also reads it, and widening it made the camera swing when walking left or right. The projection itself is the game's own. Untick to go back to the game's own culling."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x015855d0, 0x3f800000 ]  # scale (1.0), written by the VR profile (same word as the shadow fit)
      - [ calloc, 0x0027b508, 4 ]          # projection builder, culling outputs (was stfs f13,0xc(r31): vertical tangent)
      - [ be32, 0x0, 0x3d800158 ]          # lis r12,0x158
      - [ be32, 0x0, 0xc18c55d0 ]          # lfs f12,0x55d0(r12)    scale (f12 is dead here)
      - [ be32, 0x0, 0xedad0332 ]          # fmuls f13,f13,f12      vertical tangent x scale
      - [ be32, 0x0, 0xd1bf000c ]          # stfs f13,0xc(r31)
