    Author: "VR fork"
    Notes: "Test patch: the camera modifier whose apply function (0x663d8) adds random-table noise to the camera returns at once. Believed to be the hit shake; not yet confirmed (it may be the idle hand-held sway). Applies on a disc boot, not when loading a savestate."
    Patch Version: 1.0
    Enabled By Default: true
