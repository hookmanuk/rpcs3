Version: 1.2

PPU-ffd4f8966a67f15ea02a903c3a9bc96c39fa7087:
  "Unlocked frame rate (follows Vblank Rate)":
    Games:
      "Sonic & All-Stars Racing Transformed":
        BLUS30839: [ 01.00 ]
    Author: "VR fork"
    Notes: "Presents a frame on every vblank instead of every second one: the game runs at the vblank rate (60 on a TV, the headset's refresh rate in VR) instead of 30. The game steps by measured time, so it stays real-time at any rate. The vblank handler (0x21821c) releases the flip label every [0xc2e4d8] vblanks (2); this makes it 1."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x00218230, 0x38a00001 ] # li r5, 1 (was lwz r5, -0x1b28(r5): the flip interval, 2)

  "Wider view (VR culling)":
    Games:
      "Sonic & All-Stars Racing Transformed":
        BLUS30839: [ 01.00 ]
    Author: "VR fork"
    Notes: "Fills the headset view: the game culls scenery, sky and land to its own camera (50 degrees high), so turning or looking up showed them ending. This widens only the culling by the chosen scale (up to 150 degrees): the camera is built twice a frame, at the game's field of view for drawing and shadows, then widened for the culling, and the SPU render jobs' own frustum test is switched off (they still transform with the game's view). Rendering, level of detail and shadows keep the game's view, so flat play looks unchanged. Version 1.0 widened the camera itself, which broke the shadows (they differed between the eyes) and left gaps in the loop. Code in a patch-allocated cave and the code segment's unused tail (0xbe8f88)."
    Configurable Values:
      "Scale":
        Type: double_enum
        Value: 3.0
        Allowed Values:
          "1.0 (off: 50 degrees high)": 1.0
          "1.5 (75 degrees)": 1.5
          "2.0 (100 degrees)": 2.0
          "2.5 (125 degrees)": 2.5
          "3.0 (150 degrees, maximum, recommended)": 3.0
    Patch Version: 2.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x000b8024, 0xc03f0144 ] # lfs f1, 0x144(r31): the render camera keeps the game's field of view (restores version 1.0's hook)
      # The camera is built twice: at the game's field of view, then widened (scenery culling, the SPU jobs' copy); then the
      # global render block 0xcf1800 is restored from the first build's copy, so rendering and shadows keep the game's view.
