Version: 1.2

PPU-ffd4f8966a67f15ea02a903c3a9bc96c39fa7087:
  "Unlocked frame rate (follows Vblank Rate)":
    Games:
      "Sonic & All-Stars Racing Transformed":
        BLUS30839: [ 01.00 ]
    Author: "VR fork"
    Notes: "Presents a frame on every vblank instead of every second one, and simulates at the VR rate: the game's fixed 60 Hz simulation step follows the rate the VR profile writes (0xec7ff0) with the step size at 1/rate, so every flip shows a new frame (version 1.0 flipped at the headset's rate but simulated at 60, repeating frames). Without the VR profile the step stays at 60 Hz, as the game shipped. The vblank handler (0x21821c) releases the flip label every [0xc2e4d8] vblanks (2); this makes it 1."
    Patch Version: 2.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x00218230, 0x38a00001 ] # li r5, 1 (was lwz r5, -0x1b28(r5): the flip interval, 2)
      # The simulation steps at a fixed rate: the frame timer (0x40150..) splits measured time into whole steps of
      # 1/[0x402d4] (60) and a second accumulator (0x1f9698) steps by [[[0xc14ee4]+0xdc]+8] (1/60). At 90 or 120 Hz that
      # gave 0 or 1 steps a frame: 60 new frames a second. The rate is read from a free word (0xec7ff0, seeded with
      # 60 here) that the VR profile sets to the VR rate each frame, with the step size at 1/rate: a new frame every flip.
      - [ calloc, 0x00040810, 7 ] # was lfs f2, 0x14(r28): the step rate
      - [ be32, 0x0, 0x3d8000ec ] # lis r12, 0xec
      - [ be32, 0x0, 0xc04c7ff0 ] # lfs f2, 0x7ff0(r12)    rate word 0xec7ff0
      - [ be32, 0x0, 0x816c7ff0 ] # lwz r11, 0x7ff0(r12)
      - [ be32, 0x0, 0x2c0b0000 ] # cmpwi r11, 0
      - [ be32, 0x0, 0x4082000c ] # bne over the seed
      - [ be32, 0x0, 0xc05c0014 ] # lfs f2, 0x14(r28)       the game's 60
      - [ be32, 0x0, 0xd04c7ff0 ] # stfs f2, 0x7ff0(r12)    seed the word

  "Disable mesh trimming (VR)":
    Games:
      "Sonic & All-Stars Racing Transformed":
        BLUS30839: [ 01.00 ]
    Author: "VR fork"
    Notes: "The game's EDGE geometry jobs (SPU) drop triangles that cover no pixel centre of the PS3's own 1280x720 grid. At higher resolution scales, and in VR where the far track is thin slivers, those triangles would have covered pixels: gaps in the road where the sky shows through (the flat incline joints, roof edges, the far track bend). The viewport the jobs cull against (0xcf1800, set by 0x1e4018: scissor, scales, offsets) is enlarged 16x about its origin before it is copied to the jobs, so the frustum and scissor tests are unchanged and the no-pixel test runs on a 16x finer grid."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ calloc, 0x001e4150, 30 ] # was li r3, 0x80, before the viewport block is copied to the job buffer
      - [ be32, 0x0, 0x38600010 ] # li r3, 16
      - [ be32, 0x0, 0xf8610070 ] # std r3, 0x70(r1)
      - [ be32, 0x0, 0xc8010070 ] # lfd f0, 0x70(r1)
      - [ be32, 0x0, 0xfc00069c ] # fcfid f0, f0
      - [ be32, 0x0, 0xfc000018 ] # frsp f0, f0         K = 16.0
      - [ be32, 0x0, 0xc03f0050 ] # lfs f1, 0x50(r31)   viewport scale x
      - [ be32, 0x0, 0xec210032 ] # fmuls f1, f1, f0
      - [ be32, 0x0, 0xd03f0050 ] # stfs f1, 0x50(r31)
      - [ be32, 0x0, 0xc03f0054 ] # lfs f1, 0x54(r31)   scale y
      - [ be32, 0x0, 0xec210032 ]
      - [ be32, 0x0, 0xd03f0054 ]
      - [ be32, 0x0, 0xc03f0060 ] # lfs f1, 0x60(r31)   offset x
      - [ be32, 0x0, 0xec210032 ]
      - [ be32, 0x0, 0xd03f0060 ]
      - [ be32, 0x0, 0xc03f0064 ] # lfs f1, 0x64(r31)   offset y
      - [ be32, 0x0, 0xec210032 ]
      - [ be32, 0x0, 0xd03f0064 ]
      - [ be32, 0x0, 0xa07f0000 ] # lhz r3, 0(r31)      scissor x, y, w, h (u16)
      - [ be32, 0x0, 0x54632036 ] # slwi r3, r3, 4
      - [ be32, 0x0, 0xb07f0000 ] # sth r3, 0(r31)
      - [ be32, 0x0, 0xa07f0002 ]
      - [ be32, 0x0, 0x54632036 ]
      - [ be32, 0x0, 0xb07f0002 ]
      - [ be32, 0x0, 0xa07f0004 ]
      - [ be32, 0x0, 0x54632036 ]
      - [ be32, 0x0, 0xb07f0004 ]
      - [ be32, 0x0, 0xa07f0006 ]
      - [ be32, 0x0, 0x54632036 ]
      - [ be32, 0x0, 0xb07f0006 ]
      - [ be32, 0x0, 0x38600080 ] # li r3, 0x80         (the replaced instruction)

  "Disable camera shake (VR)":
    Games:
      "Sonic & All-Stars Racing Transformed":
        BLUS30839: [ 01.00 ]
    Author: "VR fork"
    Notes: "Turns off the race camera's shake, which is uncomfortable in VR: the speed and boost shake (Perlin-noise rotation, 0x86a680) and the impact shake (collisions, 0x86a0c8). Both take their own reset path every frame (as on a camera cut): the shake state stays zero and the camera keeps the view the game computed. Camera moves such as the boost dip are kept."
    Patch Version: 1.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x0086a718, 0x60000000 ] # nop (was beq): speed/boost shake always takes its reset path
      - [ be32, 0x0086a0f4, 0x60000000 ] # nop (was beq): impact shake always takes its reset path

  "Wider view (VR culling)":
    Games:
      "Sonic & All-Stars Racing Transformed":
        BLUS30839: [ 01.00 ]
    Author: "VR fork"
    Notes: "Fills the headset view: the game culls scenery, sky and land to its own camera (50 degrees high), so turning or looking up showed them ending. This widens only the culling by the chosen scale (up to 150 degrees): the camera is built twice a frame, at the game's field of view for drawing and shadows, then widened for the culling, and the SPU render jobs' own frustum test is switched off (they still transform with the game's view). Rendering, level of detail and shadows keep the game's view, so flat play looks unchanged. Version 1.0 widened the camera itself, which broke the shadows (they differed between the eyes) and left gaps in the loop. Code in a patch-allocated cave and the code segment's unused tail (0xbe8f88)."
    Configurable Values:
      "Scale":
        Type: double_enum
        Value: 3.0
        Allowed Values:
          "1.0 (off: 50 degrees high)": 1.0
          "1.5 (75 degrees)": 1.5
          "2.0 (100 degrees)": 2.0
          "2.5 (125 degrees)": 2.5
          "3.0 (150 degrees, maximum, recommended)": 3.0
    Patch Version: 2.0
    Enabled By Default: true
    Apply To Savestates: true
    Patch:
      - [ be32, 0x000b8024, 0xc03f0144 ] # lfs f1, 0x144(r31): the render camera keeps the game's field of view (restores version 1.0's hook)
      # The camera is built twice: at the game's field of view, then widened (scenery culling, the SPU jobs' copy); then the
      # global render block 0xcf1800 is restored from the first build's copy, so rendering and shadows keep the game's view.
      - [ calloc, 0x0028a304, 30 ]
      - [ be32, 0x0, 0x7c0802a6 ]
      - [ be32, 0x0, 0xf821ff81 ]
      - [ be32, 0x0, 0xf8010090 ]
